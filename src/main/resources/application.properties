# ========================================================
# Smart Parking Allocation System - Configuration
# Enterprise Web Applications (CSL273) - Problem Statement 9
# ========================================================

# Database Mode: "h2" (embedded, zero-configuration) or "mysql"
db.mode=h2

# --- H2 Database Settings (Embedded In-Memory) ---
h2.driver=org.h2.Driver
h2.url=jdbc:h2:mem:smart_parking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
h2.user=sa
h2.password=

# --- MySQL Database Settings ---
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://localhost:3306/smart_parking_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
mysql.user=root
mysql.password=your_password

# --- Active Billing Strategy ("regular" or "weekend") ---
billing.active.service=regularBillingService

# --- Parking Facility Configuration ---
parking.total.floors=3
parking.slots.per.floor=10
